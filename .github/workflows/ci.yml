name: checks
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: doc_rag_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d doc_rag_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/doc_rag_test
      ANONYMIZED_TELEMETRY: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r Presentation/API/requirements.lock.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - run: docker build -t doc-rag-api .
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Presentation/GUI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Presentation/GUI/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: docker build -t doc-rag-ui .
